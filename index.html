<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos e Inventario</title>
    <!-- Enlace al archivo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarVista('cocinero')">👨‍🍳 Vista Cocinero</button>
        <button class="tab-btn" onclick="cambiarVista('comprador')">🛒 Vista Comprador</button>
    </div>

    <!-- VISTA COCINERO -->
    <div id="vista-cocinero" class="view-section active">
        <h2>Seleccionar Productos Necesarios</h2>
        <input type="text" id="buscador" placeholder="Buscar producto..." onkeyup="filtrarProductos()">
        <div id="contenedor-productos-cocinero"></div>
        <button class="btn-action" onclick="abrirModal()">Guardar Pedido del Día</button>
    </div>

    <!-- VISTA COMPRADOR -->
    <div id="vista-comprador" class="view-section">
        <h2>Productos Solicitados por Cocina</h2>
        <p>Marca únicamente los productos que <b>SÍ</b> se compraron.</p>
        <div id="contenedor-productos-comprador"></div>
        <button class="btn-action" onclick="guardarCompraFinal()">Guardar Registro de Compra</button>
    </div>
</div>

<!-- MODAL CONFIRMACIÓN COCINERO -->
<div id="modal-confirmacion" class="modal">
    <div class="modal-content">
        <h3>¿Estos son los productos que se van a pedir?</h3>
        <ul id="lista-resumen-pedido"></ul>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-confirm" onclick="confirmarPedido()">Sí, Confirmar</button>
        </div>
    </div>
</div>

<!-- Enlace al archivo JavaScript -->
<script src="script.js"></script>
</body>
</html>
