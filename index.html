<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Pedidos e Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active" onclick="cambiarVista('cocinero')">👨‍🍳 Vista Cocinero</button>
        <button class="tab-btn" onclick="cambiarVista('comprador')">🛒 Vista Comprador</button>
    </div>

    <!-- BOTONES DE PRUEBA Y ADMIN -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button onclick="desbloquearBotones()" style="background: #f39c12; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; flex: 1;">🔓 DESBLOQUEAR BOTONES</button>
    </div>

    <!-- VISTA COCINERO -->
    <div id="vista-cocinero" class="view-section active">
        <h2>Seleccionar Productos Necesarios</h2>
        <input type="text" id="buscador-cocinero" placeholder="Buscar producto..." onkeyup="filtrarProductosCocinero()">
        <div id="contenedor-productos-cocinero"></div>
        <button id="btn-guardar-cocinero" class="btn-action" onclick="abrirModal()">Guardar Pedido del Día</button>
    </div>

    <!-- VISTA COMPRADOR -->
    <div id="vista-comprador" class="view-section">
        <h2>Productos Solicitados por Cocina</h2>
        <p>Marca los productos comprados. Los no marcados se guardarán como NO COMPRADOS.</p>
        <input type="text" id="buscador-comprador" placeholder="Buscar producto para comprar..." onkeyup="filtrarProductosComprador()">
        <div id="contenedor-productos-comprador"></div>
        <button id="btn-guardar-comprador" class="btn-action" onclick="guardarCompraFinal()">Guardar Registro de Compra</button>
    </div>
</div>

<!-- MODAL CONFIRMACIÓN COCINERO -->
<div id="modal-confirmacion" class="modal">
    <div class="modal-content">
        <h3>¿Estos son los productos que se van a pedir?</h3>
        <ul id="lista-resumen-pedido"></ul>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-confirm" onclick="confirmarPedido()">Sí, Confirmar</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
